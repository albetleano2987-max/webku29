<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Digital Space</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        /* STREAMING_CHUNK:Styling the layout... */
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #050505; transition: background-color 0.5s ease; }
        body.bg-white { background-color: #ffffff; }

        @keyframes jelly { 0%, 100% { transform: scale(1, 1); } 25% { transform: scale(0.9, 1.1); } 50% { transform: scale(1.1, 0.9); } 75% { transform: scale(0.95, 1.05); } }
        .animate-jelly:active { animation: jelly 0.6s ease; }

        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-15px); } }
        .animate-float { animation: float 5s ease-in-out infinite; }

        @keyframes rotate-border { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .border-glow { position: absolute; inset: -3px; border-radius: 2rem; padding: 3px; background: conic-gradient(from 0deg, #ff00ff, #00ffff, #ffff00, #ff00ff); mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); mask-composite: exclude; animation: rotate-border 3s linear infinite; }

        .gandor-text { font-weight: 800; font-size: 1.5rem; letter-spacing: 0.1em; color: #ffffff; text-shadow: 0 0 10px #ff00ff, 0 0 20px #00ffff, 0 0 30px #ffff00; }
        body.bg-white .gandor-text { color: #000000; text-shadow: none; }

        .bubble-text { font-weight: 800; letter-spacing: 0.05em; }

        @keyframes typing { from { width: 0 } to { width: 100% } }
        .typewriter { overflow: hidden; white-space: nowrap; margin: 0 auto; letter-spacing: .15em; animation: typing 2s steps(40, end); }

        .rgb-text { background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; }
    </style>
</head>
<body class="text-white selection:bg-purple-500/30 overflow-x-hidden">

    <!-- STREAMING_CHUNK:Rendering main interface... -->
    <main class="min-h-screen flex flex-col items-center justify-center p-4 transition-colors duration-500">
        <div class="relative w-full max-w-[320px] sm:max-w-sm text-center flex flex-col items-center">
            
            <p class="typewriter text-xs sm:text-sm mb-6 opacity-80">Hii.. Im from Banyumas</p>

            <div id="gandor-logo" class="w-28 h-28 sm:w-32 sm:h-32 mb-8 relative animate-float cursor-pointer" onclick="toggleTheme()">
                <div class="border-glow"></div>
                <div class="w-full h-full flex items-center justify-center bg-[#1a1a1a] rounded-[1.8rem] relative border border-white/10 shadow-2xl z-10 transition-colors duration-500">
                    <span class="gandor-text">GANDOR</span>
                    <div class="absolute top-2 right-2"><i class="ph ph-lightning-fill text-yellow-400 text-sm"></i></div>
                </div>
            </div>

            <div class="space-y-3 w-full">
                <button onclick="handlePlatformClick('https://instagram.com/andiigndr29')" class="animate-jelly flex items-center justify-center gap-3 w-full py-3.5 rounded-2xl border border-white/10 bg-white/5 backdrop-blur-md hover:bg-white/10 transition-all border-b-4 border-b-pink-500/20">
                    <i class="ph ph-instagram-logo text-xl sm:text-2xl text-pink-400"></i> 
                    <span class="bubble-text text-base sm:text-xl">Instagram</span>
                </button>
                
                <button onclick="handlePlatformClick('https://tiktok.com/@andiigndr29')" class="animate-jelly flex items-center justify-center gap-3 w-full py-3.5 rounded-2xl border border-white/10 bg-white/5 backdrop-blur-md hover:bg-white/10 transition-all border-b-4 border-b-cyan-500/20">
                    <i class="ph ph-tiktok-logo text-xl sm:text-2xl text-cyan-400"></i> 
                    <span class="bubble-text text-base sm:text-xl">TikTok</span>
                </button>

                <button onclick="openModal()" class="animate-jelly flex flex-col items-center justify-center w-full py-3 px-2 rounded-2xl border border-white/10 bg-purple-900/20 backdrop-blur-md hover:bg-purple-900/30 transition-all border-b-4 border-b-purple-500/20">
                    <span class="bubble-text text-base flex items-center gap-2">
                        <i class="ph ph-chat-centered-text text-purple-400"></i> Confess
                    </span>
                    <span class="text-[9px] sm:text-[10px] opacity-70 mt-0.5 uppercase tracking-tighter">Kirim pesan tanpa tahu siapa pengirimnya</span>
                </button>
            </div>

            <div class="mt-8 text-center">
                <div id="digital-clock" class="rgb-text text-2xl sm:text-3xl font-mono">00:00:00</div>
                <div id="date-text" class="text-[10px] sm:text-sm opacity-60 mt-1 uppercase tracking-widest">Loading...</div>
            </div>
        </div>
    </main>

    <!-- STREAMING_CHUNK:Defining UI elements... -->
    <div id="confessModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-[#1a1a1a] p-6 rounded-3xl w-full max-w-sm border border-white/10 shadow-2xl">
            <h2 class="text-xl font-bold mb-4 text-center text-white">Kirim Pesan Rahasia</h2>
            <textarea id="confessText" class="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-white placeholder-white/30 h-32 mb-4 resize-none" placeholder="Tulis pesan rahasiamu di sini..."></textarea>
            <div class="flex gap-2">
                <button onclick="closeModal()" class="flex-1 py-3 rounded-xl bg-white/10 text-white font-bold hover:bg-white/20 transition-all">Batal</button>
                <button id="submitBtn" onclick="submitConfess()" class="flex-1 py-3 rounded-xl bg-purple-600 text-white font-bold hover:bg-purple-500 transition-all">Kirim</button>
            </div>
        </div>
    </div>

    <div id="toast" class="hidden fixed bottom-10 left-1/2 -translate-x-1/2 px-6 py-3 rounded-full text-white font-bold shadow-2xl backdrop-blur-md z-50 text-sm"></div>

    <script>
        /* STREAMING_CHUNK:Initializing functions... */
        function openModal() { document.getElementById('confessModal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('confessModal').classList.add('hidden'); }

        function showToast(msg, isSuccess) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.className = `fixed bottom-10 left-1/2 -translate-x-1/2 px-6 py-3 rounded-full text-white font-bold shadow-2xl backdrop-blur-md z-50 text-sm ${isSuccess ? 'bg-green-600' : 'bg-red-600'}`;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        }

        async function submitConfess() {
            const btn = document.getElementById('submitBtn');
            const msg = document.getElementById('confessText').value;
            if(!msg) return;
            
            btn.innerText = "Mengirim...";
            btn.disabled = true;

            try {
                // Sekarang memanggil proxy kita di Vercel, URL Google aman di server!
                const response = await fetch('/api/confess', {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: msg })
                });
                
                if(response.ok) {
                    showToast("Pesan berhasil terkirim!", true);
                    closeModal();
                    document.getElementById('confessText').value = "";
                } else {
                    throw new Error();
                }
            } catch(e) {
                showToast("Pesan gagal terkirim.", false);
            } finally {
                btn.innerText = "Kirim";
                btn.disabled = false;
            }
        }

        function toggleTheme() {
            document.body.classList.toggle('bg-white');
            const isWhite = document.body.classList.contains('bg-white');
            const logoFrame = document.querySelector('#gandor-logo > div:last-child');
            logoFrame.classList.toggle('bg-[#1a1a1a]', !isWhite);
            logoFrame.classList.toggle('bg-gray-100', isWhite);
        }

        function handlePlatformClick(url) { window.open(url, '_blank'); }

        function updateTime() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('id-ID', { hour12: false });
            const dateString = now.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            if(document.getElementById('digital-clock')) document.getElementById('digital-clock').innerText = timeString;
            if(document.getElementById('date-text')) document.getElementById('date-text').innerText = dateString;
        }

        setInterval(updateTime, 1000);
        updateTime();
    </script>
</body>
</html>
